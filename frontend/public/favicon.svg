<!--
  브라우저 탭 아이콘. 도형은 로고 마크와 같다 (src/components/BrandMark.tsx).

  ⚠️ 여기서는 색을 hex로 박는다. "컴포넌트에 hex를 박지 않는다"는 규칙의 예외인데,
  이 파일은 React 바깥에서 브라우저가 직접 읽어 --c-* 토큰이 존재하지 않기 때문이다.
  값은 index.css의 --c-fg(#2A3E54)와 --c-quiet-soft(#7FDCBB)를 옮긴 것이라,
  팔레트를 고치면 이 파일도 함께 고쳐야 한다.

  ■ 어두운 타일에 얹는다
  탭 막대는 브라우저·테마마다 밝기가 갈린다. 투명 배경에 잉크색 봉우리를 두면
  어두운 탭에서 봉우리가 사라지므로, 잉크 타일을 깔고 그 위에 흰 봉우리를 얹는다.
  그래서 비껴간 조각도 화면의 tone="dark"와 같은 그린틸이다 — 어두운 면 위에서
  브랜드 틸이 묻히는 것은 여기서도 마찬가지다.

  ■ 도형을 0.75로 줄여 넣었다
  탭에서는 16px까지 줄어든다. 마크를 타일에 꽉 채우면 둥근 모서리에 닿아 답답하고,
  더 줄이면 봉우리가 점으로 뭉갠다. translate는 줄인 도형을 타일 한가운데 두는 값이다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#2A3E54" />
  <g transform="translate(4.05 4) scale(0.75)">
    <path d="M13 6 L20 20 L14.41 20 L13 17.18 L8.59 26 L3 26 Z" fill="#FFFFFF" />
    <path d="M20 20 L26.8 20 L28.8 24 L22 24 Z" fill="#7FDCBB" />
  </g>
</svg>
