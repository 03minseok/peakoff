<!--
  브라우저 탭 아이콘. 도형은 로고 마크와 같다 (src/components/BrandMark.tsx).

  ⚠️ XML 주석 안에는 붙임표 두 개를 쓸 수 없다. 그래서 CSS 변수 이름을 적을 때
  앞의 붙임표 둘을 뺀 "c-fg" 꼴로 쓴다. 예전에는 그대로 적어 두어 이 파일이
  well-formed XML이 아니었다 — 파서에 따라 파비콘이 통째로 안 그려진다.

  ⚠️ 색을 hex로 박는 것은 "컴포넌트에 hex를 박지 않는다"는 규칙의 예외다.
  이 파일은 React 바깥에서 브라우저가 직접 읽어 CSS 토큰이 존재하지 않기 때문이다.
  값은 index.css의 c-fg(#2A3E54)와 c-quiet-soft(#7FDCBB)를 옮긴 것이라,
  팔레트를 고치면 이 파일도 함께 고쳐야 한다.

  ■ 어두운 타일에 얹는다
  탭 막대는 브라우저·테마마다 밝기가 갈린다. 투명 배경에 잉크색 봉우리를 두면
  어두운 탭에서 봉우리가 사라지므로, 잉크 타일을 깔고 그 위에 흰 봉우리를 얹는다.
  그래서 비껴간 조각도 화면의 tone="dark"와 같은 그린틸이다.

  ⚠️ 도형은 BrandMark.tsx와 같은 좌표여야 한다. 비껴간 조각을 봉우리의 잘린 면에
  선분으로 맞대고 전체를 오른쪽으로 1.7 옮긴 변경(2026-08-27)이 여기에도 들어가
  있다 — 한쪽만 고치면 탭 아이콘과 화면 로고가 다른 모양이 된다.

  ■ 도형을 0.75로 줄여 넣었다
  탭에서는 16px까지 줄어든다. 마크를 타일에 꽉 채우면 둥근 모서리에 닿아 답답하고,
  더 줄이면 봉우리가 점으로 뭉갠다. translate는 줄인 도형을 타일 한가운데 두는 값이다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#2A3E54" />
  <g transform="translate(4 4) scale(0.75)">
    <path d="M14.7 6 L21.7 20 L16.11 20 L14.7 17.18 L10.29 26 L4.7 26 Z" fill="#FFFFFF" />
    <path d="M16.11 20 L21.7 20 L27.29 26 L21.7 26 Z" fill="#7FDCBB" />
  </g>
</svg>
