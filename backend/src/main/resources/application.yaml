server:
  # Vite 프록시(vite.config.ts)가 이 포트를 바라본다. 바꾸면 양쪽 다 수정할 것.
  port: 8080

spring:
  application:
    name: peakoff

  # 인증키를 담는 로컬 전용 파일. 저장소에 올라가지 않는다(.gitignore).
  #
  # optional: 을 붙여 파일이 없어도 서버가 뜨게 한다. 팀원이 내려받은 저장소나 CI에는
  # 그 파일이 없는데, 없다고 기동이 막히면 로그인과 상관없는 작업까지 멈춘다.
  # 배포 환경에서는 이 파일 대신 환경변수로 같은 값을 넣는다.
  config:
    import: optional:classpath:application-local.yml

  profiles:
    # 목업 데이터로 동작한다. 공공데이터 API 구현이 붙으면 이 값을 바꿔 교체한다.
    active: mock

  # 회원 정보만 담는 저장소다.
  # 공사 OpenAPI로 받은 한적도·장소 데이터는 여기 적재하지 않는다 — 실시간 호출 규칙 위반이다.
  datasource:
    # 파일 모드 H2. 서버를 껐다 켜도 가입한 회원이 남는다(메모리 모드면 사라진다).
    # 배포처를 정하고 나면 이 한 줄만 PostgreSQL URL로 바꾸면 된다.
    url: jdbc:h2:file:./data/peakoff;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 파일럿 단계라 엔티티 변경을 스키마에 자동 반영한다.
      # 마이그레이션 도구를 얹을 만큼 스키마가 크지 않다.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # 스키마 생성이 실패하면 서버를 띄우지 않는다.
        #
        # 기본값은 경고만 남기고 그냥 뜬다. 그러면 테이블이 없는 채로 서비스가 돌다가
        # 첫 INSERT에서 500이 나고, 로그를 뒤지기 전까지 원인을 알 수 없다.
        # 실제로 컬럼명 하나(day — SQL 예약어)로 이 사고가 났다.
        hbm2ddl:
          halt_on_error: true

peakoff:
  jwt:
    # 반드시 환경변수로 넣는다. 코드나 저장소에 값을 두지 않는다.
    # 로컬에서는 application-local.yml(.gitignore 대상)에 적어도 된다.
    # 비어 있으면 서버가 임의 키를 만들어 뜨고, 재시작할 때마다 토큰이 무효가 된다.
    secret: ${PEAKOFF_JWT_SECRET:}
    # 토큰 유효 기간. 심사 중 데모가 도중에 끊기지 않을 만큼 길게 둔다.
    validity: 7d

  # 소셜 로그인. 값은 application-local.yml이나 환경변수로 넣는다 — 여기 적지 않는다.
  oauth:
    kakao:
      # 카카오 개발자 콘솔 > 앱 설정 > 앱 키 > REST API 키.
      # 지도에 쓰는 JavaScript 키와 다른 값이다.
      # 비어 있으면 버튼을 눌러도 로그인 창으로 가지 못하고 오류로 답한다(우리 설정 문제라 500).
      client-id: ${KAKAO_CLIENT_ID:}
      # 콘솔에서 Client Secret을 켠 경우에만 넣는다. 카카오에서 선택 기능이라,
      # 켜지 않았다면 비워두는 것이 맞다 — 빈 값을 실어 보내면 오히려 거절당한다.
      client-secret: ${KAKAO_CLIENT_SECRET:}
      # 카카오가 사용자를 되돌려 보낼 주소. 콘솔에 등록한 값과 한 글자도 달라선 안 된다.
      # 배포하면 배포 도메인 주소로 바꾸고, 콘솔에도 같은 값을 추가한다.
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/callback/kakao}
    naver:
      # 네이버 개발자센터 > 애플리케이션 > 내 애플리케이션 > API 설정 > Client ID.
      client-id: ${NAVER_CLIENT_ID:}
      # 네이버는 Client Secret이 필수다(카카오는 선택). 없으면 로그인을 시작하지 않는다.
      client-secret: ${NAVER_CLIENT_SECRET:}
      # 네이버 개발자센터의 "Callback URL"에 등록한 값과 한 글자도 달라선 안 된다.
      redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:5173/oauth/callback/naver}

  # 공사 OpenAPI. 인증키는 application-local.yml이나 환경변수로 넣는다 — 여기 적지 않는다.
  kto:
    # 공공데이터포털 마이페이지의 "일반 인증키(Encoding)".
    #
    # 이미 URL 인코딩된 값이라 주소에 그대로 실어 보낸다. 코드에서 한 번 더 인코딩하면
    # %2B가 %252B가 되어 공사가 다른 키로 읽고 거절한다. 자바 연동에서 가장 흔히 터지는 자리.
    service-key: ${KTO_SERVICE_KEY:}

    # 한적도를 어디서 가져올지. mock | real
    #
    # real로 두면 공사 "관광지 집중률 방문자 추이 예측"을 실제로 호출한다.
    # 그 전에 공공데이터포털에서 그 API에 활용신청이 되어 있어야 한다 —
    # 인증키는 포털 계정이 아니라 API마다 따로 등록된다.
    #
    # spring.profiles.active와 따로 둔 이유: 도메인마다 실연동 시점이 다르다.
    # 집중률만 먼저 넘어가고 장소·대안은 아직 목업이라, 프로파일 하나로 전부 갈면
    # 준비되지 않은 빈까지 사라져 서버가 뜨지 않는다.
    congestion: ${KTO_CONGESTION:mock}

springdoc:
  swagger-ui:
    # http://localhost:8080/docs 로 연다. 기본 경로(/swagger-ui.html)보다 기억하기 쉽다.
    path: /docs
    # 태그·엔드포인트를 이름순으로 정렬해, 코드 순서가 바뀌어도 문서 순서는 유지되게 한다.
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
