# PR에 붙는 초록 체크표시를 만드는 워크플로.
#
# GitHub는 이 파일의 job 하나하나를 "검사(check)"로 취급한다. PR을 열면 자동으로 돌고,
# 결과가 PR 화면 아래에 ✅ / ❌ 로 붙는다. 커밋을 더 밀면 다시 돈다.
#
# ■ 여기서 하는 일은 "빌드가 되는가"까지다
# 배포는 별도 워크플로가 맡는다. 검사와 배포를 한 파일에 두면 PR을 열 때마다 배포가
# 돌지 않게 하려고 조건문이 늘어나고, 그 조건이 틀리면 배포가 조용히 안 나간다.
#
# ■ job을 둘로 나눈 이유
# 나란히 돌아 전체 시간이 둘 중 긴 쪽으로 끝나고, PR에 검사가 둘로 보여
# 어느 쪽이 깨졌는지 열어보기 전에 안다.
name: CI

on:
  pull_request:
  push:
    # main에 직접 올라간 것도 확인한다. 다른 브랜치는 PR 쪽에서 이미 도니
    # 여기까지 넣으면 같은 커밋을 두 번 검사하게 된다.
    branches: [main]

# 같은 PR에 커밋을 연달아 밀면 앞선 실행을 취소한다.
# 어차피 최신 커밋의 결과만 의미가 있고, 러너 시간도 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # gradle 의존성 캐시. 없으면 매번 수십 MB를 새로 받는다.
          cache: gradle

      # ⚠️ 여기에는 application-local.yml이 없다(.gitignore).
      # 그래서 peakoff.kto.* 기본값인 mock으로 돌아 공사 API를 부르지 않는다 —
      # CI가 인증키를 갖지 않아도 되고, 일일 한도를 태우지도 않는다.
      - name: build (compile + test)
        working-directory: backend
        run: ./gradlew build --no-daemon

      # 실패했을 때 무엇이 깨졌는지 보려면 리포트가 필요하다.
      - name: 테스트 리포트 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: 프론트 타입·린트·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm install이 아니라 ci다. lock 파일 그대로 설치해서
      # "내 컴퓨터에서는 되는데" 를 막는다.
      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # 셋을 따로 돌린다. 한 줄로 묶으면 어디서 깨졌는지 로그를 뒤져야 한다.
      - name: 타입 검사
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 빌드
        working-directory: frontend
        run: npm run build
