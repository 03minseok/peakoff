# main에 올라간 것을 EC2에 띄운다.
#
# CI(ci.yml)와 파일을 나눈 이유는 그쪽 주석에 적어 두었다 — 요약하면,
# 검사와 배포가 한곳에 있으면 "PR일 땐 배포하지 마라" 같은 조건문이 늘고
# 그 조건이 틀리면 배포가 조용히 안 나간다.
name: Deploy

on:
  push:
    branches: [main]
  # 코드가 안 바뀌어도 다시 올리고 싶을 때가 있다(환경변수만 고친 경우 등).
  workflow_dispatch:

# 배포는 겹치면 안 된다. 앞 배포가 끝나기 전에 뒤엣것이 컨테이너를 바꾸면
# 어느 이미지가 도는지 알 수 없게 된다. 취소하지 않고 줄을 세운다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR에 이미지를 올리려면 필요하다. GITHUB_TOKEN이 자동으로 발급되므로
      # 별도 계정이나 비밀번호를 만들지 않아도 된다.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 이미지 이름은 소문자만 받는다. 저장소 이름에 대문자가 섞이면 push가 실패한다.
      - name: 이미지 이름 정하기
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그를 둘 붙인다.
      #   latest    — 사람이 기억하기 쉬운 이름
      #   <커밋SHA> — 지금 도는 것이 어느 커밋인지 서버에서 바로 알 수 있고,
      #               되돌릴 때 이 값만 바꾸면 된다
      - name: 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # 러너는 매번 새 컴퓨터라 캐시가 없다. GitHub Actions 캐시에 남겨
          # 다음 배포에서 gradle 의존성을 다시 받지 않게 한다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ■ 청소가 파이프라인 <맨 앞>에 있다 (2026-09-07)
      #
      # 8/31에 prune에 -a를 붙여 옛 이미지가 실제로 지워지게 고쳤고, 자리도
      # pull 앞으로 당겼다. 그런데 <더 앞에서> 죽는 길이 남아 있었다 —
      # 디스크가 차면 compose 파일을 푸는 scp가 먼저 종료코드 1로 죽고,
      # 그러면 그 아래 있는 청소에 <도달하지 못한다.>
      #
      # 한 번 차면 스스로 못 빠져나오는 고리가 된다: 배포가 죽는다 → 청소가 안 돈다
      # → 다음 배포도 같은 자리에서 죽는다. 실제로 그렇게 멈춰 섰다.
      #
      # ⚠️ <청소는 서버에 닿아서 하는 첫 일이어야 한다.> 배포의 어느 단계가
      # 자리를 필요로 하든 그 앞이라야 한다. "성공 경로 안에 두지 않는다"는 같은 규칙이
      # 이번에는 한 칸 더 위를 가리켰다.
      #
      # 돌고 있는 컨테이너가 쓰는 이미지는 사용 중이라 남는다. 그래서 이 시점에
      # 서버에 남는 것은 <돌고 있는 것> 하나뿐이고, 되돌릴 것이 필요하면
      # GHCR에서 다시 받으면 된다 — 태그는 그대로 있다.
      - name: 서버 자리 만들기
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # -a가 핵심이다. 없으면 <태그 없는> 이미지만 지우는데 우리 옛 이미지는
            # 전부 커밋 SHA 태그가 붙어 있어 하나도 안 지워진다.
            docker image prune -af > /dev/null
            # 서버에서 빌드하지는 않지만, 손으로 한 번이라도 빌드했다면 여기 쌓인다.
            docker builder prune -af > /dev/null
            # 청소하고도 얼마 안 남았다면 로그에 미리 보인다. 다음에 터지기 전에 안다.
            df -h /

      # 서버에는 소스가 없다. compose 파일만 보내고 이미지는 GHCR에서 받아간다.
      - name: compose 파일 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /home/${{ secrets.EC2_USER }}/peakoff
          strip_components: 1
          # 여기서 죽으면 로그에 "Process exited with status 1"만 남는다.
          # 원격이 실제로 뭐라고 했는지 봐야 디스크인지 권한인지 가려낼 수 있다.
          debug: true

      - name: EC2에서 띄우기
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e
            cd ~/peakoff

            # .env를 여기서 만든다. 비밀값이 저장소에 남지 않고, 서버에 손으로
            # 넣어 둔 값이 낡는 일도 없다. 다음 배포에서 통째로 다시 쓴다.
            #
            # ⚠️ 여기 없는 값은 서버에 <닿지 않는다.> GEMINI_API_KEY가 그렇게 빠져 있어
            # 배포된 서비스에서 챗봇이 계속 꺼져 있었다(2026-09-07). 비밀을 새로 만들면
            # 이 줄과 compose의 environment <두 곳>을 함께 이어야 한다.
            umask 077
            cat > .env <<EOF
            IMAGE=$IMAGE
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            KTO_SERVICE_KEY=${{ secrets.KTO_SERVICE_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            PEAKOFF_JWT_SECRET=${{ secrets.PEAKOFF_JWT_SECRET }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            NAVER_REDIRECT_URI=${{ secrets.NAVER_REDIRECT_URI }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 청소는 <이 잡의 첫 단계>에서 이미 했다(위 "서버 자리 만들기").
            # 여기로 되돌리지 말 것 — 그러면 디스크가 찼을 때 compose 파일을 보내는
            # scp가 먼저 죽어, 청소가 있는 이 자리에 영영 닿지 못한다.
            docker compose pull
            docker compose up -d

            # 떴는지 실제로 확인한다. 여기서 안 보면 배포가 "성공"으로 끝난 뒤에야
            # 심사위원이 죽은 서버를 만난다.
            echo "기동 대기…"
            for i in $(seq 1 40); do
              if curl -fsS -m 3 http://localhost:8080/health > /dev/null; then
                echo "✅ 헬스체크 통과"
                break
              fi
              if [ "$i" = 40 ]; then
                echo "❌ 2분 안에 뜨지 않았다. 로그:"
                docker compose logs --tail 80 app
                exit 1
              fi
              sleep 3
            done

            # 떴다고 끝이 아니다. <내용>까지 본다 — 200인데 빈 배포를 성공으로 넘기지 않는다.
            #
            # 공사가 침묵하면 이 서비스는 죽지 않고 <지역이 조용히 빠지는> 구조다(CLAUDE.md 절대 규칙 1).
            # 헬스체크는 그 상태를 성공이라 말한다. 그래서 공사 자료가 실제로 들어왔는지를
            # 지역 카탈로그 한 건으로 확인한다: 지역 목록의 첫 슬러그로 장소를 물어 id가 하나라도 오는가.
            # 카탈로그는 부팅 직후 워머가 채우므로(KtoCacheWarmer, 실측 3~4초) 잠깐 기다려 준다.
            #
            # jq 없이 grep으로만 본다 — 서버에 무엇이 깔려 있는지에 기대지 않는다.
            echo "내용 확인…"
            for i in $(seq 1 20); do
              regions=$(curl -fsS -m 5 http://localhost:8080/api/regions || true)
              slug=$(printf '%s' "$regions" | grep -o '"slug":"[a-z0-9-]*"' | head -1 | cut -d'"' -f4)
              if [ -n "$slug" ]; then
                places=$(curl -fsS -m 8 "http://localhost:8080/api/places?region=$slug&limit=3" || true)
                if printf '%s' "$places" | grep -q '"id":"'; then
                  echo "✅ 내용 확인 통과 — $slug 카탈로그에 장소가 있다"
                  # 청소는 잡의 첫 단계에서 이미 했다. 여기서 또 돌리면 방금 물러난
                  # 이미지까지 지워져, 새 배포가 잘못됐을 때 되돌릴 것이 서버에 없다.
                  exit 0
                fi
              fi
              sleep 3
            done

            echo "❌ 서버는 떴는데 내용이 비었다 — 지역 목록 또는 장소 카탈로그가 없다. 로그:"
            docker compose logs --tail 80 app
            exit 1
