# main에 올라간 것을 EC2에 띄운다.
#
# CI(ci.yml)와 파일을 나눈 이유는 그쪽 주석에 적어 두었다 — 요약하면,
# 검사와 배포가 한곳에 있으면 "PR일 땐 배포하지 마라" 같은 조건문이 늘고
# 그 조건이 틀리면 배포가 조용히 안 나간다.
name: Deploy

on:
  push:
    branches: [main]
  # 코드가 안 바뀌어도 다시 올리고 싶을 때가 있다(환경변수만 고친 경우 등).
  workflow_dispatch:

# 배포는 겹치면 안 된다. 앞 배포가 끝나기 전에 뒤엣것이 컨테이너를 바꾸면
# 어느 이미지가 도는지 알 수 없게 된다. 취소하지 않고 줄을 세운다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR에 이미지를 올리려면 필요하다. GITHUB_TOKEN이 자동으로 발급되므로
      # 별도 계정이나 비밀번호를 만들지 않아도 된다.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 이미지 이름은 소문자만 받는다. 저장소 이름에 대문자가 섞이면 push가 실패한다.
      - name: 이미지 이름 정하기
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그를 둘 붙인다.
      #   latest    — 사람이 기억하기 쉬운 이름
      #   <커밋SHA> — 지금 도는 것이 어느 커밋인지 서버에서 바로 알 수 있고,
      #               되돌릴 때 이 값만 바꾸면 된다
      - name: 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # 러너는 매번 새 컴퓨터라 캐시가 없다. GitHub Actions 캐시에 남겨
          # 다음 배포에서 gradle 의존성을 다시 받지 않게 한다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서버에는 소스가 없다. compose 파일만 보내고 이미지는 GHCR에서 받아간다.
      - name: compose 파일 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /home/${{ secrets.EC2_USER }}/peakoff
          strip_components: 1

      - name: EC2에서 띄우기
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e
            cd ~/peakoff

            # .env를 여기서 만든다. 비밀값이 저장소에 남지 않고, 서버에 손으로
            # 넣어 둔 값이 낡는 일도 없다. 다음 배포에서 통째로 다시 쓴다.
            umask 077
            cat > .env <<EOF
            IMAGE=$IMAGE
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            KTO_SERVICE_KEY=${{ secrets.KTO_SERVICE_KEY }}
            PEAKOFF_JWT_SECRET=${{ secrets.PEAKOFF_JWT_SECRET }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            NAVER_REDIRECT_URI=${{ secrets.NAVER_REDIRECT_URI }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ■ 받기 전에 치운다 (2026-08-31, 디스크가 차서 배포가 죽고서 고침)
            #
            # 배포마다 이미지에 커밋 SHA 태그가 하나씩 붙는데 지우는 사람이 없어
            # t3.micro의 8GB 볼륨이 찼다. pull 도중 "no space left on device"로 죽는다.
            #
            # ⚠️ -a가 핵심이다. 옛날에는 헬스체크를 통과한 뒤 `prune -f`를 돌렸는데,
            # -a 없는 prune은 <태그가 없는> 이미지만 지운다. 우리 옛 이미지는 전부
            # SHA 태그가 붙어 있어 <하나도 지워지지 않았다> — 있으나 마나였다.
            #
            # ⚠️ 자리도 pull <앞>이다. 뒤에 두면 이미 꽉 찬 디스크에 받으려다 죽은 뒤에야
            # 청소가 돌아, 정작 필요한 그 배포는 실패한다. 실패한 배포는 청소도 못 했다
            # (성공 경로 안에 있었다).
            #
            # 지금 도는 컨테이너가 쓰는 이미지는 사용 중이라 남는다. 그래서 이 시점에
            # 서버에 남는 것은 <돌고 있는 것 + 방금 받을 것> 둘뿐이다. 더 옛것으로
            # 되돌려야 하면 GHCR에서 다시 받으면 된다 — 태그는 그대로 있다.
            docker image prune -af > /dev/null
            # 청소하고도 얼마 안 남았다면 로그에서 미리 보인다. 다음에 또 터지기 전에 안다.
            df -h /

            docker compose pull
            docker compose up -d

            # 떴는지 실제로 확인한다. 여기서 안 보면 배포가 "성공"으로 끝난 뒤에야
            # 심사위원이 죽은 서버를 만난다.
            echo "기동 대기…"
            for i in $(seq 1 40); do
              if curl -fsS -m 3 http://localhost:8080/health > /dev/null; then
                echo "✅ 헬스체크 통과"
                # 청소는 위에서 이미 했다. 여기서 또 돌리면 방금 물러난 이미지까지
                # 지워져, 새 배포가 잘못됐을 때 바로 되돌릴 것이 서버에 남지 않는다.
                exit 0
              fi
              sleep 3
            done

            echo "❌ 2분 안에 뜨지 않았다. 로그:"
            docker compose logs --tail 80 app
            exit 1
